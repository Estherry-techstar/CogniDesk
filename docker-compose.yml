services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cognidesk_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cognidesk
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: cognidesk_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/cognidesk
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: